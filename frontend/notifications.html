<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts & Notifications — MedWaste Watch</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/reset.css">
    <link rel="stylesheet" href="/assets/css/typography.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <script src="/assets/js/theme.js"></script>
    <style>
        .notif-item {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            transition: all var(--transition-fast);
        }

        .notif-item.unread {
            border-left: 4px solid var(--primary);
            background-color: var(--bg-surface);
        }

        .notif-item.read {
            opacity: 0.75;
            background-color: var(--bg-surface-secondary);
        }

        .notif-icon-box {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .notif-content {
            flex: 1;
        }

        .notif-title {
            font-size: 0.925rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
        }

        .notif-msg {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
        }

        .notif-time {
            font-size: 0.70rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="app-main">
            <div id="topbar-container"></div>

            <main class="content-container">
                <div class="page-header">
                    <div class="page-title-group">
                        <h1>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--primary);"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                            <span>Clinical Notifications & Alert Center</span>
                        </h1>
                        <p>Critical expiry alerts, ward reservation decisions, and inventory threshold events.</p>
                    </div>
                    <div class="page-actions">
                        <button class="btn btn-secondary btn-sm" onclick="markAllAsRead()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                            <span>Mark All Read</span>
                        </button>
                    </div>
                </div>

                <div id="notifications-list-container">
                    <div class="card" style="padding:2.5rem; text-align:center;">
                        <p class="text-muted">Loading notifications...</p>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await Navigation.init('notifications');
            await loadNotifications();
        });

        async function loadNotifications() {
            const container = document.getElementById('notifications-list-container');
            try {
                const res = await API.get('/notifications');
                if (!res || !res.data) return;
                const items = res.data.items || [];

                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="card">
                            <div class="empty-state">
                                <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg>
                                <div class="empty-state-title">No Notifications Yet</div>
                                <div class="empty-state-text">You are fully caught up. When batches approach expiry or reservations are reviewed, alerts will appear here.</div>
                            </div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = items.map(n => {
                    const isUnread = !n.is_read;
                    let iconBg = 'var(--primary-light)';
                    let iconColor = 'var(--primary)';
                    if (n.type === 'critical_expiry') {
                        iconBg = 'var(--critical-bg)';
                        iconColor = 'var(--critical)';
                    } else if (n.type === 'low_stock') {
                        iconBg = 'var(--warning-bg)';
                        iconColor = 'var(--warning)';
                    }

                    return `
                        <div class="notif-item ${isUnread ? 'unread' : 'read'}" id="notif-${n.id}">
                            <div class="notif-icon-box" style="background:${iconBg}; color:${iconColor};">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg>
                            </div>
                            <div class="notif-content">
                                <div class="notif-title">${App.escapeHtml(n.title)}</div>
                                <div class="notif-msg">${App.escapeHtml(n.message)}</div>
                                <div style="display:flex; align-items:center; justify-content:space-between;">
                                    <span class="notif-time">${App.formatDateTime(n.created_at)}</span>
                                    <div>
                                        ${n.link_url ? `<a href="${n.link_url}" class="btn btn-outline btn-sm">Inspect Record</a>` : ''}
                                        ${isUnread ? `<button class="btn btn-secondary btn-sm" onclick="markRead(${n.id})">Mark Read</button>` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                App.toast('error', 'Failed to load notifications');
                console.error(err);
            }
        }

        async function markRead(id) {
            try {
                await API.post(`/notifications/${id}/read`);
            } catch (err) {
                App.toast('error', 'Failed to update notification');
                return;
            }
            try {
                await loadNotifications();
                await Navigation.updateNotificationBadge();
            } catch (e) {
                console.error(e);
            }
        }

        async function markAllAsRead() {
            try {
                await API.post('/notifications/read-all');
                App.toast('success', 'All notifications marked as read');
            } catch (err) {
                App.toast('error', 'Failed to mark notifications read');
                return;
            }
            try {
                await loadNotifications();
                await Navigation.updateNotificationBadge();
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
